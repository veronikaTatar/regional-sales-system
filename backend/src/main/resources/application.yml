server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        name: REGSALES_SESSION
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
spring:
  application:
    name: regional-sales-system
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 25MB
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/regional_sales?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}
    username: ${DB_USERNAME:regional_sales}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    redis:
      enabled: false
  endpoint:
    health:
      show-details: never
app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}
  bootstrap-admin:
    login: ${BOOTSTRAP_ADMIN_LOGIN:}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    full-name: ${BOOTSTRAP_ADMIN_FULL_NAME:Администратор системы}
